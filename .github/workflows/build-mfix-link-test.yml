name: Build and publish MFIX Link Test APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-link-test/**"
      - ".github/workflows/build-mfix-link-test.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: gradle -p android-link-test assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MFIX-Link-Test-accessibility-probe
          path: android-link-test/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish installable APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mfix-link-test-v1.1.0
          name: MFIX Link Test 1.1.0 – Accessibility Probe
          prerelease: true
          make_latest: false
          files: android-link-test/app/build/outputs/apk/debug/app-debug.apk
